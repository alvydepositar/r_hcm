{% extends "base.html" %}

{% block extra_head %}
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
{% endblock %}

{% block page_title %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'employee_management' %}" class="text-decoration-none text-primary">
                    <i class="bi bi-arrow-left-short"></i> Dashboard
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Divisions</li>
        </ol>
    </nav>
{% endblock %}


{% block content %}
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="card-title mb-0">Divisions</h5>
                <button id="add-division-btn" type="button" class="btn btn-primary btn-md">
                    <i class="ti ti-plus"> </i> Add Division
                </button>
            </div>
            <table id="divisions-table" class="table table-striped">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th class="text-center">Division ID</th>
                        <th>Division Name</th>
                        <th>Abbreviation</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Add Division Modal -->
    <div class="modal fade" id="addDivisionModal" tabindex="-1" aria-labelledby="addDivisionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Division</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-division-form">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-division-name">Division Name</label>
                                <input id="add-division-name" name="division_name" type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-abbreviation">Abbreviation</label>
                                <input id="add-abbreviation" name="abbreviation" type="text" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    {% load static %}
    <script src="{% static 'js/hr/employee/divisions.js' %}"></script>
{% endblock %}
