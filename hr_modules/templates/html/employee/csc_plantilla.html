{% extends "base.html" %}

{% block page_title %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'employee_management' %}" class="text-decoration-none text-primary">
                    <i class="bi bi-arrow-left-short"></i> Dashboard
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">CSC Plantilla</li>
        </ol>
    </nav>
{% endblock %}


{% block content %}
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="card-title mb-1">CSC Plantilla</h5>
                </div>
                <div class="d-flex gap-2 align-items-center flex-nowrap">
                    <input type="text" class="table-search form-control" id="table-search" placeholder="Search..." style="min-width: 200px; white-space: nowrap;">
                    <button id="toggle-csc-vacancies-btn" type="button" class="btn btn-outline-warning btn-md text-nowrap">
                        <i class="ti ti-filter"></i> Show Vacancies Only
                    </button>
                    <button id="edit-all-csc-plantilla-btn" type="button" class="btn btn-outline-primary btn-md text-nowrap">
                        <i class="ti ti-edit"></i> Edit All Rows
                    </button>
                    <button id="save-all-csc-plantilla-btn" type="button" class="btn btn-success btn-md text-nowrap d-none">
                        <i class="ti ti-device-floppy"></i> Save All
                    </button>
                    <button id="cancel-all-csc-plantilla-btn" type="button" class="btn btn-secondary btn-md text-nowrap d-none">
                        <i class="ti ti-x"></i> Cancel All
                    </button>
                    <button id="delete-selected-csc-plantilla-btn" type="button" class="btn btn-danger btn-md d-none">
                        <i class="ti ti-trash"></i> Delete Selected
                    </button>
                    <button id="add-csc-plantilla-btn" type="button" class="btn btn-primary btn-md">
                        <i class="ti ti-plus"></i> Add Plantilla Item
                    </button>
                </div>
            </div>
            <div id="csc-plantilla-table"></div>
        </div>
    </div>

    <div class="modal fade" id="addCSCPlantillaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add CSC Plantilla Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-csc-plantilla-form">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-item-number">Plantilla Item No.</label>
                                <input id="add-item-number" name="item_number" type="text" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-position">Position Title</label>
                                <select id="add-position" name="position" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-division">Place of Assignment</label>
                                <select id="add-division" name="division" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-salary-grade">Salary Grade</label>
                                <select id="add-salary-grade" name="salary_grade" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-salary-step">Salary Step</label>
                                <select id="add-salary-step" name="salary_step" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-availability-status">Availability / Vacancy</label>
                                <select id="add-availability-status" name="availability_status" class="form-select" required>
                                    <option value="vacant">Vacant</option>
                                    <option value="filled">Filled</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-monthly-salary">Monthly Salary</label>
                                <input id="add-monthly-salary" type="text" class="form-control" readonly>
                            </div>
                            <div class="col-md-4 mb-0">
                                <label class="form-label" for="add-annual-salary">Annual Salary</label>
                                <input id="add-annual-salary" type="text" class="form-control" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    {% load static %}
    <script src="{% static 'js/hr/employee/csc_plantilla.js' %}"></script>
{% endblock %}
