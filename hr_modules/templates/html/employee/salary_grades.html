{% extends "base.html" %}

{% block page_title %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'employee_management' %}" class="text-decoration-none text-primary">
                    <i class="bi bi-arrow-left-short"></i> Dashboard
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Salary Grades</li>
        </ol>
    </nav>
{% endblock %}


{% block content %}
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="card-title mb-1">CSC Salary Grade</h5>
                </div>
                <div class="d-flex gap-2 align-items-center flex-nowrap">
                    <input type="text" class="table-search form-control" id="table-search" placeholder="Search..." style="min-width: 200px; white-space: nowrap;">
                    <button id="edit-all-salary-grades-btn" type="button" class="btn btn-outline-primary btn-md text-nowrap">
                        <i class="ti ti-edit"></i> Edit All Rows
                    </button>
                    <button id="save-all-salary-grades-btn" type="button" class="btn btn-success btn-md text-nowrap d-none">
                        <i class="ti ti-device-floppy"></i> Save All
                    </button>
                    <button id="cancel-all-salary-grades-btn" type="button" class="btn btn-secondary btn-md text-nowrap d-none">
                        <i class="ti ti-x"></i> Cancel All
                    </button>
                    <button id="delete-selected-salary-grades-btn" type="button" class="btn btn-danger btn-md d-none">
                        <i class="ti ti-trash"></i> Delete Selected
                    </button>
                    <button id="add-salary-grade-btn" type="button" class="btn btn-primary btn-md">
                        <i class="ti ti-plus"> </i> Add Salary Grade
                    </button>
                </div>
            </div>
            <div id="salary-grades-table"></div>
        </div>
    </div>

    <div class="modal fade" id="addSalaryGradeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Salary Grade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-salary-grade-form">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-csc-grade">Salary Grade</label>
                                <input id="add-csc-grade" name="csc_grade" type="number" min="1" class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-1">Step 1</label>
                                <input id="add-step-1" name="step_1" type="number" min="0" step="0.01" class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-2">Step 2</label>
                                <input id="add-step-2" name="step_2" type="number" min="0" step="0.01" class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-3">Step 3</label>
                                <input id="add-step-3" name="step_3" type="number" min="0" step="0.01" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-4">Step 4</label>
                                <input id="add-step-4" name="step_4" type="number" min="0" step="0.01" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-5">Step 5</label>
                                <input id="add-step-5" name="step_5" type="number" min="0" step="0.01" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-6">Step 6</label>
                                <input id="add-step-6" name="step_6" type="number" min="0" step="0.01" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="add-step-7">Step 7</label>
                                <input id="add-step-7" name="step_7" type="number" min="0" step="0.01" class="form-control">
                            </div>
                            <div class="col-md-3 mb-0">
                                <label class="form-label" for="add-step-8">Step 8</label>
                                <input id="add-step-8" name="step_8" type="number" min="0" step="0.01" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    {% load static %}
    <script src="{% static 'js/hr/employee/salary_grades.js' %}"></script>
{% endblock %}
