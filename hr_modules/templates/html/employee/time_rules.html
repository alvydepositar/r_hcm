{% extends "base.html" %}

{% block page_title %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'employee_management' %}" class="text-decoration-none text-primary">
                    <i class="bi bi-arrow-left-short"></i> Dashboard
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Time Rules</li>
        </ol>
    </nav>
{% endblock %}


{% block content %}
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="card-title mb-0">Time Rules</h5>
                <div class="d-flex gap-2 align-items-center flex-nowrap">
                    <input type="text" class="table-search form-control" id="table-search" placeholder="Search..." style="min-width: 200px; white-space: nowrap;">
                    <button id="edit-all-time-rules-btn" type="button" class="btn btn-outline-primary btn-md text-nowrap">
                        <i class="ti ti-edit"></i> Edit All Rows
                    </button>
                    <button id="save-all-time-rules-btn" type="button" class="btn btn-success btn-md text-nowrap d-none">
                        <i class="ti ti-device-floppy"></i> Save All
                    </button>
                    <button id="cancel-all-time-rules-btn" type="button" class="btn btn-secondary btn-md text-nowrap d-none">
                        <i class="ti ti-x"></i> Cancel All
                    </button>
                    <button id="delete-selected-time-rules-btn" type="button" class="btn btn-danger btn-md d-none">
                        <i class="ti ti-trash"></i> Delete Selected
                    </button>
                    <button id="add-time-rule-btn" type="button" class="btn btn-primary btn-md">
                        <i class="ti ti-plus"> </i> Add Time Rule
                    </button>
                </div>
            </div>
            <div id="time-rules-table"></div>
        </div>
    </div>

    <!-- Add Time Rule Modal -->
    <div class="modal fade" id="addTimeRuleModal" tabindex="-1" aria-labelledby="addTimeRuleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Time Rule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-time-rule-form">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label" for="add-time-rule-name">Time Rule Name</label>
                                <input id="add-time-rule-name" name="time-rule-name" type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-earliest-in">Earliest In</label>
                                <input id="add-earliest-in" name="earliest-in" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-latest-in">Latest In</label>
                                <input id="add-latest-in" name="latest-in" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-earliest-out">Earliest Out</label>
                                <input id="add-earliest-out" name="earliest-out" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="add-latest-out">Latest Out</label>
                                <input id="add-latest-out" name="latest-out" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-lunch-start">Lunch Start</label>
                                <input id="add-lunch-start" name="lunch-start" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-lunch-end">Lunch End</label>
                                <input id="add-lunch-end" name="lunch-end" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="add-lunch-grace-period">Lunch Grace Period (min)</label>
                                <input id="add-lunch-grace-period" name="lunch-grace-period" type="number" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    {% load static %}
    <script src="{% static 'js/hr/employee/time_rules.js' %}"></script>
{% endblock %}
