{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HCM Login</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'images/logos/favicon.png' %}" />
    <link rel="stylesheet" href="{% static 'css/styles.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tabulator-theme.css' %}" />
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img src="{% static 'images/logos/logo.png' %}" alt="HCM" class="img-fluid mb-3" style="max-height: 56px;">
                            <h4 class="mb-1">Human Capital Management</h4>
                            <p class="text-muted mb-0">Sign in to continue.</p>
                        </div>

                        {% if form.errors %}
                            <div class="alert alert-danger border mb-3">
                                Invalid username or password.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            {% if next %}
                                <input type="hidden" name="next" value="{{ next }}">
                            {% endif %}
                            <div class="mb-3">
                                <label class="form-label" for="id_username">Username</label>
                                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" class="form-control" required id="id_username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="id_password">Password</label>
                                <input type="password" name="password" autocomplete="current-password" class="form-control" required id="id_password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
